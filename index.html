<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Žemėlapis ir Maršrutai</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-panel">
        <button id="toggleMenuBtn">Braižymo meniu</button>
        
        <div id="drawMenu" class="draw-menu hidden">
            <h3>Braižymo nustatymai</h3>
            
            <label for="lineName">Linijos pavadinimas:</label>
            <input type="text" id="lineName" placeholder="Pvz., Dviračių takas">

            <label>Pasirinkite spalvą:</label>
            <div id="colorPalette" class="color-palette"></div>
            
            <div class="custom-color-wrapper">
                <label for="customColor">Pasirinktinė spalva:</label>
                <input type="color" id="customColor" value="#e6194B">
            </div>

            <label>Režimas:</label>
            <div class="radio-group">
                <label><input type="radio" name="lineOption" value="new" checked> Nauja linija</label>
                <label><input type="radio" name="lineOption" value="continue"> Tęsti esamą liniją</label>
            </div>

            <select id="lineSelect" class="hidden">
                <!-- Užsipildo dinamiškai -->
            </select>

            <button id="startDrawBtn">Braižyti pele</button>
            <button id="stopDrawBtn" class="hidden">Baigti braižybą pele</button>
            <button id="gpsDrawBtn" class="gps-btn">Sekioti su GPS</button>

            <hr>

            <div class="delete-section">
                <label for="deleteSelect">Ištrinti maršrutą:</label>
                <select id="deleteSelect">
                    <option value="">-- Pasirinkite maršrutą --</option>
                </select>
                <button id="deleteSelectedBtn" class="danger-btn">Ištrinti pasirinktą</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
