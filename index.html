<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Žygio Žemėlapis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Meniu skydelis viršuje dešinėje -->
    <div class="menu-panel">
        <button id="toggleMenuBtn">Meniu</button>
        <div id="drawMenu" class="draw-menu hidden">
            <input type="text" id="lineName" placeholder="Maršruto pavadinimas">
            
            <div id="colorPalette" class="color-palette"></div>
            <div class="color-custom">
                <label for="customColor">Spalvos ratas:</label>
                <input type="color" id="customColor" value="#2563eb">
            </div>

            <div class="radio-group">
                <label><input type="radio" name="lineOption" value="new" checked> Naujas</label>
                <label><input type="radio" name="lineOption" value="continue"> Tęsti esamą</label>
            </div>
            <select id="lineSelect" class="hidden"></select>

            <button id="gpsDrawBtn" class="gps-btn">Pradėti GPS įrašymą</button>

            <div id="statsPanel" class="stats-panel hidden">
                <div>Trukmė: <b id="statTime">00:00</b></div>
                <div>Atstumas: <b id="statDistance">0 m</b></div>
                <div>Greitis: <b id="statSpeed">0.0 km/h</b></div>
                <div>Vid. greitis: <b id="statAvgSpeed">0.0 km/h</b></div>
                <div>Sukilimas: <b id="statElevation">0 m</b></div>
            </div>

            <hr>
            <select id="deleteSelect"><option value="">-- Pasirinkite ištrinti --</option></select>
            <button id="deleteSelectedBtn" class="danger-btn">Ištrinti</button>
        </div>
    </div>

    <!-- Žemėlapis -->
    <div id="map"></div>

    <!-- Estetiška kortelė mobiliesiems apačioje, rodoma paspaudus ant maršruto -->
    <div id="info-card" class="hidden">
        <div class="card-header">
            <h3 id="card-title">Maršrutas</h3>
            <button id="close-btn">&times;</button>
        </div>
        <div class="card-body">
            <div class="stat-item"><span>Trukmė:</span> <strong id="card-duration">-</strong></div>
            <div class="stat-item"><span>Vid. greitis:</span> <strong id="card-speed">-</strong></div>
            <div class="stat-item"><span>Sukilimas:</span> <strong id="card-elevation">-</strong></div>
            <div class="stat-item"><span>Data:</span> <strong id="card-date">-</strong></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
