<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>GPS Žygio Žemėlapis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="Untitled-1.css">
</head>
<body>

    <!-- PRISIJUNGIMO / REGISTRACIJOS LANGAS -->
    <div id="authContainer" class="auth-overlay">
        <div class="auth-card">
            <h2 id="authTitle">Prisijungimas</h2>
            <form id="authForm">
                <div class="form-group" style="text-align: left; margin-bottom: 12px;">
                    <label class="field-label">El. paštas</label>
                    <input type="email" id="authEmail" required placeholder="pavyzdys@gmail.com">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                    <label class="field-label">Slaptažodis</label>
                    <input type="password" id="authPassword" required placeholder="Bent 6 simboliai">
                </div>
                <button type="submit" id="authSubmitBtn" class="gps-btn" style="width: 100%;">Prisijungti</button>
            </form>
            <div style="margin-top: 15px; font-size: 13px;">
                <span id="toggleAuthText">Neturite paskyros?</span>
                <button id="toggleAuthBtn" type="button" style="background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; margin-left: 5px;">Registruotis</button>
            </div>
        </div>
    </div>

    <!-- PAGRINDINĖ PROGRAMOS SĄSAJA (Atsiranda prisijungus) -->
    <div id="appContainer" class="hidden">
        <!-- Vartotojo juosta viršuje / Atsijungimo mygtukas -->
        <div class="top-user-bar">
            <span id="userEmailDisplay" style="font-size: 12px; font-weight: 600; color: var(--muted);"></span>
            <button id="logoutBtn" class="logout-chip">Atsijungti</button>
        </div>

        <!-- Socialinė skiltis -->
        <div id="tab-social" class="tab-content">
            <div class="empty-tab-message">
                <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Socialinė skiltis netrukus</span>
            </div>
        </div>

        <!-- Įrašymo skiltis -->
        <div id="tab-record" class="tab-content active">
            <div id="map"></div>

            <div id="recordPanel">
                <!-- Paruošimas prieš įrašymą -->
                <div id="setupView">
                    <div id="activityRow" class="act-row"></div>
                    <input type="text" id="lineName" placeholder="Pavadinimas (nebūtina)">
                    <button id="toggleMoreBtn" type="button" class="link-btn">Daugiau nustatymų</button>
                    <div id="moreOpts" class="hidden">
                        <label class="field-label">Spalva</label>
                        <div class="color-row">
                            <div id="colorPalette" class="color-palette"></div>
                            <input type="color" id="customColor" value="#1f6feb" title="Pasirinkti spalvą">
                        </div>
                        <div class="segmented">
                            <label><input type="radio" name="lineOption" value="new" checked><span>Naujas</span></label>
                            <label><input type="radio" name="lineOption" value="continue"><span>Tęsti esamą</span></label>
                        </div>
                        <select id="lineSelect" class="hidden"></select>
                    </div>
                    <button id="gpsDrawBtn" class="gps-btn">Pradėti įrašymą</button>
                </div>

                <!-- Įrašymo metu -->
                <div id="statsPanel" class="hidden">
                    <div class="live-top"><span class="rec-dot"></span><span id="liveActivity">Įrašoma</span></div>
                    <div class="live-grid">
                        <div class="live-stat wide"><span>Trukmė</span><b id="statTime">00:00</b></div>
                        <div class="live-stat"><span>Atstumas</span><b id="statDistance">0 m</b></div>
                        <div class="live-stat"><span id="lblSpeed">Tempas</span><b id="statSpeed">--</b></div>
                        <div class="live-stat"><span>Sukilimas</span><b id="statElevation">0 m</b></div>
                    </div>
                    <button id="stopBtn" class="gps-btn stop">Baigti įrašymą</button>
                </div>
            </div>
        </div>

        <!-- Buvusių maršrutų skiltis -->
        <div id="tab-history" class="tab-content">
            <div class="history-map-wrap">
                <div id="map-history"></div>
                <button id="fitAllBtn" class="fab-chip" aria-label="Rodyti visus maršrutus">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                </button>
                <button id="openActBtn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
                    Mano veikla
                </button>
            </div>
            <div id="history-list">
                <div class="list-head"><span>Mano veikla</span><button id="closeActBtn" aria-label="Uždaryti">&times;</button></div>
                <div id="history-items"></div>
                <div id="history-empty" class="hidden">Dar nėra išsaugotų įrašų</div>
            </div>
        </div>

        <!-- Maršruto informacija -->
        <div id="info-card" class="hidden" role="dialog" aria-label="Maršruto informacija">
            <div class="card-header">
                <span id="card-dot" class="card-dot"></span>
                <div class="card-titles">
                    <h3 id="card-title">Maršrutas</h3>
                    <small id="card-date">-</small>
                </div>
                <button id="close-btn" aria-label="Uždaryti">&times;</button>
            </div>
            <div class="card-grid">
                <div class="tile"><span>Atstumas</span><strong id="card-distance">-</strong></div>
                <div class="tile"><span>Trukmė</span><strong id="card-duration">-</strong></div>
                <div class="tile"><span id="card-speed-label">Vid. tempas</span><strong id="card-speed">-</strong></div>
                <div class="tile"><span>Sukilimas</span><strong id="card-elevation">-</strong></div>
            </div>
            <button id="card-delete" class="delete-link">Ištrinti įrašą</button>
        </div>

        <!-- Apatinis meniu -->
        <nav class="bottom-nav">
            <button class="nav-item" data-tab="social">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Socialinė</span>
            </button>
            <button class="nav-item active" data-tab="record">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
                <span>Įrašymas</span>
            </button>
            <button class="nav-item" data-tab="history">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
                <span>Buvę</span>
            </button>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
