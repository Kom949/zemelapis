<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Pasivaikščiojimų Žemėlapis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-panel">
        <button id="toggleMenuBtn">Valdymo meniu</button>
        
        <div id="drawMenu" class="draw-menu hidden">
            <h3>Maršruto Nustatymai</h3>
            
            <label for="lineName">Maršruto pavadinimas:</label>
            <input type="text" id="lineName" placeholder="Pvz., Rytinis pasivaikščiojimas">

            <label>Pasirinkite spalvą:</label>
            <div id="colorPalette" class="color-palette"></div>

            <label>Režimas:</label>
            <div class="radio-group">
                <label><input type="radio" name="lineOption" value="new" checked> Naujas maršrutas</label>
                <label><input type="radio" name="lineOption" value="continue"> Tęsti esamą maršrutą</label>
            </div>

            <select id="lineSelect" class="hidden">
                <!-- Užsipildo dinamiškai -->
            </select>

            <button id="gpsDrawBtn" class="gps-btn">Pradėti GPS įrašymą</button>

            <!-- Realaus laiko statistikos panelė -->
            <div id="statsPanel" class="stats-panel hidden">
                <h4>Pasivaikščiojimo duomenys</h4>
                <div class="stat-grid">
                    <div class="stat-box">
                        <span class="stat-label">Trukmė</span>
                        <span id="statTime" class="stat-value">00:00:00</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Atstumas</span>
                        <span id="statDistance" class="stat-value">0 m</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Esamas greitis</span>
                        <span id="statSpeed" class="stat-value">0.0 km/h</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Vid. greitis</span>
                        <span id="statAvgSpeed" class="stat-value">0.0 km/h</span>
                    </div>
                </div>
            </div>

            <hr>

            <div class="delete-section">
                <label for="deleteSelect">Ištrinti maršrutą:</label>
                <select id="deleteSelect">
                    <option value="">-- Pasirinkite maršrutą --</option>
                </select>
                <button id="deleteSelectedBtn" class="danger-btn">Ištrinti pasirinktą</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
